<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Höher oder Tiefer</title>
<meta name="description" content="Ein kleines Higher-Lower-Spiel für jedes Last.fm-Profil. / A little higher-or-lower game for any Last.fm profile.">
<script>
  // Theme vor dem ersten Zeichnen setzen, damit nichts aufblitzt
  try { var t = JSON.parse(localStorage.getItem('hot:theme')); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: wie ein Notizzettel-Projekt. Eine schmale Spalte auf der Startseite,
   im Spiel zwei Karten nebeneinander (am Handy untereinander), dazwischen ein
   von Hand umkringeltes "vs". */
:root {
  --bg: #f1f0ea;
  --paper: #ffffff;
  --ink: #1d1d22;
  --ink-2: #4b4b54;
  --ink-3: #7c7c85;
  --rule: #d9d8d0;
  --edge: #1d1d22;
  --pen: #2b50d6;
  --mark: #ffe14a;
  --on-mark: #1d1d22;
  --good: #1d8f4e;
  --bad: #d23a3a;
  --shadow: #1d1d22;
  --hl: #ffe14a;
  --on-solid: #ffffff;
  --f-head: "Rubik", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-hand: "Caveat", "Comic Sans MS", "Chalkboard SE", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #18191d; --paper: #222429; --ink: #eceae4; --ink-2: #bdbbb4; --ink-3: #8d8c92;
    --rule: #34363d; --edge: #5b5d66; --pen: #8aa4ff; --mark: #e9c93b; --on-mark: #1d1d22;
    --good: #43c97b; --bad: #ff6f6f; --shadow: #000000; --hl: rgba(233, 201, 59, .42); --on-solid: #10131f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #18191d; --paper: #222429; --ink: #eceae4; --ink-2: #bdbbb4; --ink-3: #8d8c92;
  --rule: #34363d; --edge: #5b5d66; --pen: #8aa4ff; --mark: #e9c93b; --on-mark: #1d1d22;
  --good: #43c97b; --bad: #ff6f6f; --shadow: #000000; --hl: rgba(233, 201, 59, .42); --on-solid: #10131f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--pen); text-underline-offset: 2px; }
:focus-visible { outline: 2px dashed var(--pen); outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mark { background: linear-gradient(transparent 58%, var(--hl) 58%, var(--hl) 94%, transparent 94%); color: inherit; padding: 0 .08em; }
.hand { font-family: var(--f-hand); font-weight: 700; color: var(--pen); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-family: var(--f-head); font-weight: 700; font-size: 1rem; line-height: 1.2;
  background: var(--paper); color: var(--ink); border: 2px solid var(--edge); border-radius: 8px;
  padding: 10px 16px; cursor: pointer; text-decoration: none;
  box-shadow: 3px 3px 0 var(--shadow); transition: transform .08s, box-shadow .08s;
}
.btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--shadow); }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }
.btn:disabled { opacity: .55; cursor: default; transform: none; box-shadow: 3px 3px 0 var(--shadow); }
.btn-main { background: var(--pen); color: #fff; border-color: var(--edge); }
[data-theme="dark"] .btn-main { color: #10131f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn-main { color: #10131f; } }
.btn-sm { padding: 6px 11px; font-size: .9rem; box-shadow: 2px 2px 0 var(--shadow); }

/* top bar (shared) */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(env(safe-area-inset-top, 0px) + 12px) 18px 12px; }
.brand { font-family: var(--f-head); font-weight: 800; font-size: 1.05rem; text-decoration: none; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; white-space: nowrap; }
.brand small { font-family: var(--f-hand); font-weight: 700; font-size: 1.05rem; color: var(--ink-3); margin-left: 4px; }
.theme { width: 40px; height: 40px; padding: 0; border-radius: 50%; display: grid; place-items: center; box-shadow: 2px 2px 0 var(--shadow); }
.theme svg { width: 20px; height: 20px; }

/* ---------- start ---------- */
.start-wrap { max-width: 620px; margin: 0 auto; padding: 10px 18px calc(env(safe-area-inset-bottom, 0px) + 40px); }
h1 { font-family: var(--f-head); font-weight: 900; font-size: clamp(2.9rem, 11vw, 4.6rem); line-height: .95; letter-spacing: -.02em; margin: 26px 0 12px; }
h1 .or { font-family: var(--f-hand); font-weight: 700; font-size: .55em; letter-spacing: 0; color: var(--pen); display: inline-block; transform: rotate(-6deg) translateY(-.15em); margin: 0 .05em; }
.intro { font-size: 1.12rem; color: var(--ink-2); margin: 0 0 26px; max-width: 32rem; }
.panel { background: var(--paper); border: 2px solid var(--edge); border-radius: 12px; padding: 20px; box-shadow: 4px 4px 0 var(--shadow); position: relative; }
.lbl { display: block; font-family: var(--f-head); font-weight: 700; font-size: .92rem; margin: 0 0 6px; }
.row { display: flex; gap: 10px; }
.row input[type=text] { flex: 1; min-width: 0; }
.txt { background: var(--bg); border: 2px solid var(--edge); border-radius: 8px; padding: 10px 12px; font-size: 1.08rem; outline: none; }
.txt:focus { border-color: var(--pen); }
.txt::placeholder { color: var(--ink-3); }
.note {
  position: absolute; right: -14px; top: -34px; transform: rotate(4deg);
  font-family: var(--f-hand); font-weight: 700; font-size: 1.25rem; color: var(--pen); line-height: 1; pointer-events: none;
  display: flex; align-items: flex-end; gap: 2px;
}
.note svg { width: 46px; height: 34px; margin-bottom: -12px; }
.choices { display: grid; gap: 16px; margin-top: 20px; padding-top: 18px; border-top: 2px dashed var(--rule); }
.pick { display: flex; flex-wrap: wrap; gap: 6px; }
.pick button { background: var(--bg); border: 2px solid var(--rule); border-radius: 999px; padding: 5px 13px; font-size: .95rem; cursor: pointer; color: var(--ink-2); }
.pick button:hover { border-color: var(--ink-3); color: var(--ink); }
.pick button[aria-checked=true] { border-color: var(--edge); background: var(--mark); color: var(--on-mark); font-weight: 700; }
select.txt { font-size: 1rem; padding: 8px 10px; cursor: pointer; }
.hint { font-size: .86rem; color: var(--ink-3); margin: 4px 0 0; }
.key { margin-top: 18px; padding-top: 14px; border-top: 2px dashed var(--rule); font-size: .95rem; color: var(--ink-2); }
.key summary { cursor: pointer; font-family: var(--f-head); font-weight: 700; color: var(--ink); }
.key p { margin: 8px 0 10px; }
.key .txt { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .92rem; }
.key-state { font-family: var(--f-hand); font-size: 1.15rem; font-weight: 700; margin-left: 6px; }
.key-state.ok { color: var(--good); }
.key-state.no { color: var(--bad); }
.err { margin: 14px 0 0; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--bad) 12%, transparent); border: 2px solid var(--bad); color: var(--ink); font-size: .95rem; }
.recent { margin-top: 30px; }
.recent h2, .how h2 { font-family: var(--f-head); font-weight: 800; font-size: 1.15rem; margin: 0 0 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; background: var(--paper); border: 2px solid var(--edge); border-radius: 999px; padding: 4px 12px 4px 4px; cursor: pointer; font-weight: 600; box-shadow: 2px 2px 0 var(--shadow); }
.chip:hover { transform: translate(-1px, -1px); }
.chip .av { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; display: grid; place-items: center; font-family: var(--f-head); font-weight: 800; font-size: .8rem; color: #1d1d22; overflow: hidden; flex: none; }
.chip small { color: var(--ink-3); font-weight: 500; }
.how { margin-top: 34px; }
.how ol { margin: 0; padding-left: 1.3em; color: var(--ink-2); }
.how li { margin: 4px 0; }
.how kbd { font-family: ui-monospace, Menlo, monospace; font-size: .85em; border: 1.5px solid var(--edge); border-bottom-width: 3px; border-radius: 5px; padding: 0 5px; background: var(--paper); color: var(--ink); }
footer.foot { margin-top: 40px; padding-top: 14px; border-top: 2px dashed var(--rule); font-size: .88rem; color: var(--ink-3); }

/* ---------- loading ---------- */
.load { min-height: 100%; display: grid; place-items: center; padding: 24px; text-align: center; }
.load p { margin: 8px 0 0; color: var(--ink-2); }
.load b { font-family: var(--f-head); font-size: 1.6rem; color: var(--ink); }
.dots { display: inline-flex; gap: 6px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--pen); animation: hop 1s ease-in-out infinite; }
.dots i:nth-child(2) { animation-delay: .15s; background: var(--mark); border: 2px solid var(--edge); }
.dots i:nth-child(3) { animation-delay: .3s; }
@keyframes hop { 50% { transform: translateY(-10px); } }

/* ---------- game ---------- */
.game { min-height: 100%; display: flex; flex-direction: column; }
.game .bar { border-bottom: 2px solid var(--edge); background: var(--paper); }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.who .av { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid var(--edge); display: grid; place-items: center; font-family: var(--f-head); font-weight: 800; color: #1d1d22; flex: none; overflow: hidden; }
.who div { min-width: 0; line-height: 1.25; }
.who b { display: block; font-family: var(--f-head); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who span { display: block; font-size: .8rem; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score { display: flex; gap: 14px; align-items: baseline; font-size: .85rem; color: var(--ink-3); white-space: nowrap; }
.score b { font-family: var(--f-head); font-weight: 800; font-size: 1.4rem; color: var(--ink); margin-left: 4px; font-variant-numeric: tabular-nums; display: inline-block; }
.score b.bump { animation: bump .4s ease; }
@keyframes bump { 40% { transform: scale(1.4) rotate(-6deg); color: var(--good); } }
.back { background: none; border: 0; cursor: pointer; font-family: var(--f-head); font-weight: 700; color: var(--ink-2); padding: 6px 4px; white-space: nowrap; }
.back:hover { color: var(--ink); text-decoration: underline; }

.arena { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 18px; max-width: 1060px; width: 100%; margin: 0 auto; padding: 26px 18px calc(env(safe-area-inset-bottom, 0px) + 26px); }
.card { background: var(--paper); border: 2px solid var(--edge); border-radius: 14px; box-shadow: 5px 5px 0 var(--shadow); padding: 18px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.card.left { transform: rotate(-.6deg); }
.card.right { transform: rotate(.5deg); }
.art { aspect-ratio: 1 / 1; width: 100%; max-width: 260px; margin: 0 auto; border-radius: 8px; border: 2px solid var(--edge); overflow: hidden; display: grid; place-items: center; position: relative; }
.art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.art .ini { font-family: var(--f-head); font-weight: 900; font-size: clamp(3rem, 8vw, 5.2rem); color: #1d1d22; letter-spacing: -.03em; }
.art .doodle { position: absolute; right: 10px; bottom: 6px; font-family: var(--f-hand); font-size: 1.1rem; color: #1d1d22; opacity: .6; transform: rotate(-4deg); }
.info { display: grid; gap: 4px; text-align: center; justify-items: center; min-width: 0; }
.tag { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.title { margin: 0; font-family: var(--f-head); font-weight: 800; font-size: clamp(1.4rem, 2.8vw, 2rem); line-height: 1.1; overflow-wrap: anywhere; text-wrap: balance; }
.title.long { font-size: clamp(1.15rem, 2.1vw, 1.5rem); }
.by { margin: 0; color: var(--ink-2); }
.num { margin-top: 6px; font-family: var(--f-head); font-weight: 900; font-size: clamp(2.4rem, 5.2vw, 3.6rem); line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.num small { display: block; font-family: var(--f-body); font-weight: 500; font-size: .9rem; letter-spacing: 0; color: var(--ink-3); margin-top: 4px; }
.ask { margin: 6px 0 0; color: var(--ink-2); }
.ask b { color: var(--ink); }
.btns { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; width: 100%; margin-top: 6px; }
.btns .btn { padding: 12px 10px; font-size: 1.05rem; }
.btn-up { background: var(--good); color: var(--on-solid); }
.btn-down { background: var(--bad); color: var(--on-solid); }
.card.right.ok { border-color: var(--good); }
.card.right.no { border-color: var(--bad); }
.card.right.ok .num { color: var(--good); }
.card.right.no .num { color: var(--bad); }

.vs { position: relative; width: 74px; height: 64px; display: grid; place-items: center; font-family: var(--f-hand); font-weight: 700; font-size: 2rem; color: var(--ink); }
.vs svg.ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.vs svg.ring path { fill: none; stroke: var(--pen); stroke-width: 2.5; stroke-linecap: round; }
.vs.ok { color: var(--good); }
.vs.ok svg.ring path { stroke: var(--good); }
.vs.no { color: var(--bad); }
.vs.no svg.ring path { stroke: var(--bad); }

.in-left { animation: inLeft .45s cubic-bezier(.3, .8, .25, 1) both; }
.in-right { animation: inRight .45s cubic-bezier(.3, .8, .25, 1) .06s both; }
@keyframes inLeft { from { transform: translateX(60%) rotate(.5deg); } to { transform: rotate(-.6deg); } }
@keyframes inRight { from { transform: translateY(18px) rotate(3deg); opacity: 0; } to { transform: rotate(.5deg); opacity: 1; } }
.wobble { animation: wobble .5s ease; }
@keyframes wobble { 20% { transform: rotate(3deg) translateX(-6px); } 45% { transform: rotate(-2deg) translateX(6px); } 70% { transform: rotate(1.5deg) translateX(-3px); } 100% { transform: rotate(.5deg); } }

/* game over */
.over { position: fixed; inset: 0; z-index: 30; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 18px; background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.over-card { width: 100%; max-width: 440px; background: var(--paper); border: 2px solid var(--edge); border-radius: 14px; box-shadow: 6px 6px 0 var(--shadow); padding: 22px; transform: rotate(-.8deg); animation: drop .35s cubic-bezier(.2, .9, .3, 1.25) both; }
@keyframes drop { from { transform: translateY(-20px) rotate(-3deg); opacity: 0; } to { transform: rotate(-.8deg); opacity: 1; } }
.over-card .hand { font-size: 1.6rem; margin: 0; color: var(--bad); }
.over-card h2 { font-family: var(--f-head); font-weight: 900; font-size: 2.1rem; margin: 0; line-height: 1.05; }
.big { font-family: var(--f-head); font-weight: 900; font-size: 4.6rem; line-height: 1; margin: 12px 0 2px; display: flex; align-items: baseline; gap: 12px; }
.big span { font-family: var(--f-body); font-weight: 500; font-size: 1rem; color: var(--ink-2); }
.record { font-family: var(--f-hand); font-size: 1.5rem; font-weight: 700; color: var(--good); transform: rotate(-3deg); display: inline-block; }
.why { color: var(--ink-2); margin: 10px 0 18px; }
.why b { color: var(--ink); }
.over-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.over-btns .btn:first-child { grid-column: 1 / -1; }
.over-note { margin: 12px 0 0; font-size: .88rem; color: var(--ink-3); min-height: 1.2em; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 40; }

@media (max-width: 760px) {
  .note { display: none; }
  .arena { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto; gap: 8px; padding: 14px 12px calc(env(safe-area-inset-bottom, 0px) + 16px); align-content: center; }
  .card { flex-direction: row; align-items: center; padding: 12px; gap: 12px; }
  .art { width: 92px; flex: none; max-width: none; }
  .art .ini { font-size: 2.2rem; }
  .art .doodle { display: none; }
  .info { text-align: left; justify-items: start; flex: 1; }
  .title { font-size: 1.3rem; }
  .title.long { font-size: 1.05rem; }
  .num { font-size: 2.2rem; margin-top: 2px; }
  .num small { display: inline; margin-left: 4px; }
  .btns .btn { padding: 10px 6px; font-size: .98rem; }
  .vs { margin: 0 auto; width: 60px; height: 48px; font-size: 1.6rem; }
  @keyframes inLeft { from { transform: translateY(60%) rotate(.5deg); } to { transform: rotate(-.6deg); } }
  .score { gap: 10px; }
  .back span { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .in-left, .in-right, .wobble, .over-card, .score b.bump, .dots i { animation: none !important; }
}

/* v2 additions */
.credit { margin: 14px 0 0; padding-top: 10px; border-top: 2px dashed var(--rule); font-family: var(--f-hand); font-weight: 700; font-size: 1.1rem; color: var(--ink-3); text-align: center; }
.tools { display: flex; align-items: center; gap: 10px; }
.lang { display: inline-flex; border: 2px solid var(--edge); border-radius: 8px; overflow: hidden; box-shadow: 2px 2px 0 var(--shadow); }
.lang button { border: 0; background: var(--paper); padding: 6px 10px; font-family: var(--f-head); font-weight: 700; font-size: .85rem; cursor: pointer; color: var(--ink-3); }
.lang button + button { border-left: 2px solid var(--edge); }
.lang button[aria-pressed=true] { background: var(--mark); color: var(--on-mark); }
.art .pic { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .35s ease; }
.art .pic.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .art .pic { transition: none; } }
</style>
</head>
<body>

<div id="screen-start">
  <header class="bar">
    <span class="brand"><span data-i18n="brand"></span> <small>v2</small></span>
    <div class="tools">
      <div class="lang" role="group" aria-label="Sprache / Language">
        <button type="button" data-lang="de" aria-pressed="false">DE</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button class="btn theme" type="button" data-theme-toggle></button>
    </div>
  </header>
  <main class="start-wrap">
    <h1 data-i18n="h1"></h1>
    <p class="intro" data-i18n="intro"></p>

    <form id="start-form" class="panel" autocomplete="off" novalidate>
      <span class="note" aria-hidden="true"><span data-i18n="note"></span>
        <svg viewBox="0 0 46 34"><path d="M40 2 C 42 14, 30 24, 8 26 M8 26 l 7 -6 M8 26 l 8 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </span>
      <label class="lbl" for="user" data-i18n="lblUser"></label>
      <div class="row">
        <input class="txt" id="user" name="user" type="text" data-i18n-ph="phUser" spellcheck="false" autocapitalize="off" autocorrect="off" maxlength="40" enterkeyhint="go">
        <button class="btn btn-main" type="submit" id="go" data-i18n="go"></button>
      </div>

      <div class="choices">
        <div>
          <span class="lbl" id="lbl-type" data-i18n="lblType"></span>
          <div class="pick" role="radiogroup" aria-labelledby="lbl-type" data-name="type">
            <button type="button" role="radio" aria-checked="true" data-v="artists" data-i18n="tArtists"></button>
            <button type="button" role="radio" aria-checked="false" data-v="tracks" data-i18n="tTracks"></button>
            <button type="button" role="radio" aria-checked="false" data-v="albums" data-i18n="tAlbums"></button>
            <button type="button" role="radio" aria-checked="false" data-v="mixed" data-i18n="tMixed"></button>
          </div>
        </div>
        <div>
          <label class="lbl" for="period" data-i18n="lblPeriod"></label>
          <select class="txt" id="period">
            <option value="overall" data-i18n="p_overall"></option>
            <option value="12month" data-i18n="p_12month"></option>
            <option value="6month" data-i18n="p_6month"></option>
            <option value="3month" data-i18n="p_3month"></option>
            <option value="1month" data-i18n="p_1month"></option>
            <option value="7day" data-i18n="p_7day"></option>
          </select>
        </div>
        <div>
          <span class="lbl" id="lbl-pool" data-i18n="lblPool"></span>
          <div class="pick" role="radiogroup" aria-labelledby="lbl-pool" data-name="pool">
            <button type="button" role="radio" aria-checked="false" data-v="50" data-i18n="pool50"></button>

      })));
    }
    return imgMem.get(k);
  }

  /* ---------------- start screen ---------------- */
  const form = $('#start-form'), input = $('#user'), errEl = $('#start-err');
  const state = { type: 'artists', period: 'overall', pool: 100 };
  function setPick(name, v) {
    $$('.pick[data-name="' + name + '"] button').forEach(b => b.setAttribute('aria-checked', b.dataset.v === String(v) ? 'true' : 'false'));
  }
  $$('.pick[data-name]').forEach(g => {
    const name = g.dataset.name;
    g.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      state[name] = name === 'pool' ? +b.dataset.v : b.dataset.v;
      setPick(name, b.dataset.v);
      store.set('prefs', state);
    });
    g.addEventListener('keydown', e => {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      const bs = $$('button', g); const i = bs.findIndex(b => b.getAttribute('aria-checked') === 'true');
      const n = bs[(i + (e.key === 'ArrowRight' ? 1 : bs.length - 1)) % bs.length];
      n.click(); n.focus(); e.preventDefault();
    });
  });
  $('#period').addEventListener('change', e => { state.period = e.target.value; store.set('prefs', state); });
  const prefs = store.get('prefs', null);
  if (prefs) Object.assign(state, prefs);
  setPick('type', state.type); setPick('pool', state.pool); $('#period').value = state.period;

  let errKey = '', errVars = null;
  function showErr(key, vars) { errKey = key || ''; errVars = vars || null; errEl.textContent = key ? t(key, vars) : ''; errEl.hidden = !key; }
  function keyUI() {
    if (API_KEY) { $('#keybox').hidden = true; return; }
    const has = !!apiKey(), ks = $('#key-state');
    ks.textContent = has ? t('keyOk') : t('keyMissing');
    ks.className = 'key-state ' + (has ? 'ok' : 'no');
    if (!has) $('#keybox').open = true;
    $('#apikey').value = store.get('apikey', '');
    if (errKey) errEl.textContent = t(errKey, errVars);
  }
  $('#key-save').addEventListener('click', () => {
    const v = $('#apikey').value.trim();
    if (v && !/^[0-9a-f]{32}$/i.test(v)) { showErr('eBadKey'); return; }
    store.set('apikey', v); showErr(''); keyUI();
    if (v) $('#keybox').open = false;
  });

  const SWATCH = ['#ffd84d', '#9fd3ff', '#ffb3c1', '#b8f0c4', '#d6c6ff', '#ffc999', '#a8e6e0', '#f4b6f0'];
  function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  const swatch = s => SWATCH[hash(s) % SWATCH.length];
  const initials = s => (String(s).replace(/[^\p{L}\p{N} ]/gu, '').trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2) || '♪').toUpperCase();
  function avatar(name, img, cls) {
    const fb = '<span class="' + cls + '" style="background:' + swatch(name) + '">' + esc(initials(name)) + '</span>';
    if (!img) return fb;
    return '<img class="' + cls + '" src="' + esc(img) + '" alt="" loading="lazy" data-fb="' + esc(fb) + '">';
  }
  function bindAvatarFallback(rootEl) {
    $$('img[data-fb]', rootEl).forEach(img => img.addEventListener('error', () => { img.outerHTML = img.getAttribute('data-fb'); }, { once: true }));
  }

  function recentUI() {
    const rec = store.get('recent', []);
    const box = $('#recent');
    if (!rec.length) { box.hidden = true; return; }
    box.hidden = false;
    $('#recent-chips').innerHTML = rec.slice(0, 8).map(r => {
      const best = store.get('bestAny:' + r.name.toLowerCase(), 0);
      return '<button type="button" class="chip" data-user="' + esc(r.name) + '">' + avatar(r.name, r.img, 'av') + esc(r.name) + (best ? ' <small>' + t('bestShort') + ' ' + best + '</small>' : '') + '</button>';
    }).join('');
    bindAvatarFallback($('#recent-chips'));
  }
  $('#recent-chips').addEventListener('click', e => {
    const b = e.target.closest('[data-user]'); if (!b) return;
    input.value = b.dataset.user; start();
  });
  form.addEventListener('submit', e => { e.preventDefault(); start(); });

  function show(id) { ['screen-start', 'screen-load', 'screen-game'].forEach(s => { $('#' + s).hidden = s !== id; }); window.scrollTo(0, 0); }

  /* ---------------- game ---------------- */
  const G = { user: null, pool: [], used: new Set(), a: null, b: null, peek: null, streak: 0, best: 0, locked: true, key: '', phase: 'ask' };

  async function start() {
    const user = input.value.trim().replace(/^@/, '').replace(/^https?:\/\/(www\.)?last\.fm\/(\w+\/)?user\//i, '').replace(/\/.*$/, '');
    if (!user) { showErr('eNoUser'); input.focus(); return; }
    if (!apiKey()) { showErr('eNoKey'); $('#keybox').open = true; $('#apikey').focus(); return; }
    showErr('');
    $('#load-name').textContent = user;
    show('screen-load');
    try {
      const types = state.type === 'mixed' ? ['artists', 'tracks', 'albums'] : [state.type];
      const [info, ...lists] = await Promise.all([loadUser(user)].concat(types.map(ty => loadTop(user, ty, state.period, state.pool))));
      const pool = [].concat(...lists);
      if (pool.length < 10) throw new LfmError('few', '');
      G.user = info; G.pool = pool;
      G.key = [info.name.toLowerCase(), state.type, state.period, state.pool].join('|');
      G.best = store.get('best:' + G.key, 0);
      rememberRecent(info);
      if (/^https?:/.test(location.protocol)) {
        const p = new URLSearchParams({ user: info.name, type: state.type, period: state.period, pool: String(state.pool) });
        history.replaceState(null, '', location.pathname + '?' + p.toString());
      }
      profileUI();
      newGame();
      show('screen-game');
    } catch (e) {
      show('screen-start');
      if (e.code === 'few') showErr('eFew');
      else if (I18N.de['e' + e.code]) showErr('e' + e.code);
      else showErr('eOther', { m: e.message || '?' });
    }
  }
  function rememberRecent(info) {
    const rec = store.get('recent', []).filter(r => r.name.toLowerCase() !== info.name.toLowerCase());
    rec.unshift({ name: info.name, img: info.img });
    store.set('recent', rec.slice(0, 12));
  }
  function profileUI() {
    const u = G.user;
    const yr = u.since ? new Date(u.since * 1000).getFullYear() : null;
    $('#g-prof').innerHTML = avatar(u.name, u.img, 'av') + '<div><b>' + esc(u.name) + '</b><span>' + t('mode_' + state.type) + ' · ' + t('period_' + state.period) + ' · Top ' + state.pool + (yr ? ' · ' + t('since', { y: yr }) : '') + '</span></div>';
    bindAvatarFallback($('#g-prof'));
  }

  function pickNext(prev, streak) {
    const all = G.pool.filter(it => it !== prev && !G.used.has(it));
    if (all.length < 2) { G.used.clear(); return pickNext(prev, streak); }
    if (!prev) return all[Math.floor(Math.random() * all.length)];
    const s = streak;
    const maxRatio = s < 4 ? Infinity : s < 9 ? 3 : s < 16 ? 1.9 : s < 25 ? 1.45 : 1.25;
    const ratio = it => Math.max(it.n, prev.n) / Math.max(1, Math.min(it.n, prev.n));
    let cand = all.filter(it => ratio(it) <= maxRatio && it.n !== prev.n);
    if (cand.length < 3) cand = all.filter(it => it.n !== prev.n);
    if (!cand.length) cand = all;
    return cand[Math.floor(Math.random() * cand.length)];
  }
  const RING = '<svg class="ring" viewBox="0 0 74 64" aria-hidden="true"><path d="M58 9 C 44 1, 14 4, 7 22 C 1 38, 18 58, 40 57 C 61 56, 72 40, 66 22 C 63 13, 54 8, 44 7"/></svg>';
  let vsMode = '';
  function vsUI(mode) {
    vsMode = mode;
    const vs = $('#vs');
    vs.className = 'vs' + (mode ? ' ' + mode : '');
    vs.innerHTML = RING + '<span>' + (mode === 'ok' ? t('yes') : mode === 'no' ? t('no') : t('vs')) + '</span>';
  }
  function newGame() {
    G.used = new Set(); G.streak = 0;
    G.a = pickNext(null, 0); G.used.add(G.a);
    G.b = pickNext(G.a, 0); G.used.add(G.b);
    G.peek = null;
    $('#g-streak').textContent = '0';
    $('#g-best').textContent = G.best;
    $('#over').hidden = true;
    vsUI('');
    render(false);
  }
  const DOODLES = ['♪', '♫', '★', '♥', '✿', '☾'];
  function tileHTML(it) {
    const h = hash(it.title + '|' + it.by);
    return '<span class="ini">' + esc(initials(it.title)) + '</span><span class="doodle">' + DOODLES[(h >>> 7) % DOODLES.length] + '</span>';
  }
  function infoHTML(it, side) {
    const long = it.title.length > 26 ? ' long' : '';
    let info = '<span class="tag">' + t('tag_' + it.type) + '</span><h2 class="title' + long + '">' + esc(it.title) + '</h2>' + (it.by ? '<p class="by">' + esc(it.by) + '</p>' : '');
    if (side === 'a') {
      info += '<div class="num">' + fmt(it.n) + '<small>' + t('scrobbles') + '</small></div>';
    } else if (G.phase === 'ask') {
      info += '<p class="ask">' + t('ask', { a: esc(G.a.title) }) + '</p>' +
        '<div class="btns"><button class="btn btn-up" type="button" data-ans="up">' + t('up') + '</button><button class="btn btn-down" type="button" data-ans="down">' + t('down') + '</button></div>' +
        '<div class="num" hidden><span>0</span><small>' + t('scrobbles') + '</small></div>';
    } else {
      info += '<div class="num"><span>' + fmt(it.n) + '</span><small>' + t('scrobbles') + '</small></div>';
    }
    return info;
  }
  function cardHTML(it, side) {
    const h = hash(it.title + '|' + it.by);
    return '<div class="art" style="background:' + SWATCH[h % SWATCH.length] + '">' + tileHTML(it) + '</div><div class="info">' + infoHTML(it, side) + '</div>';
  }
  function hydrate(card, it) {
    const key = it.type + '|' + it.title + '|' + it.by;
    card.dataset.key = key;
    imgFor(it).then(u => {
      if (!u || card.dataset.key !== key) return;
      const art = $('.art', card);
      const img = new Image();
      img.alt = ''; img.referrerPolicy = 'no-referrer'; img.className = 'pic';
      img.src = u;
      art.appendChild(img);
      requestAnimationFrame(() => img.classList.add('on'));
    });
  }
  function bindAnswers() { $$('[data-ans]', $('#card-b')).forEach(b => b.addEventListener('click', () => answer(b.dataset.ans === 'up'))); }
  function render(animate) {
    G.phase = 'ask';
    const ca = $('#card-a'), cb = $('#card-b');
    ca.className = 'card left'; cb.className = 'card right';
    ca.innerHTML = cardHTML(G.a, 'a');
    cb.innerHTML = cardHTML(G.b, 'b');
    hydrate(ca, G.a); hydrate(cb, G.b);
    if (animate && !REDUCE) { void ca.offsetWidth; ca.classList.add('in-left'); cb.classList.add('in-right'); }
    bindAnswers();
    G.locked = false;
    // pick the next card already, so its picture is ready when we get there
    G.peek = pickNext(G.b, G.streak + 1);
    imgFor(G.peek);
    $('#live').textContent = t('liveAsk', { a: G.a.title, an: fmt(G.a.n), b: G.b.title });
  }
  function refreshCards() {
    $('.info', $('#card-a')).innerHTML = infoHTML(G.a, 'a');
    $('.info', $('#card-b')).innerHTML = infoHTML(G.b, 'b');
    if (G.phase === 'ask') bindAnswers();
    vsUI(vsMode);
  }
  function countTo(el, to, dur) {
    if (REDUCE) { el.textContent = fmt(to); return Promise.resolve(); }
    return new Promise(res => {
      const t0 = performance.now();
      (function step(now) {
        const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
        el.textContent = fmt(to * e);
        if (p < 1) requestAnimationFrame(step); else res();
      })(t0);
    });
  }
  async function answer(up) {
    if (G.locked) return;
    G.locked = true;
    G.phase = 'reveal';
    const cb = $('#card-b');
    const ok = up ? G.b.n >= G.a.n : G.b.n <= G.a.n;
    $('.btns', cb).hidden = true;
    $('.ask', cb).hidden = true;
    const num = $('.num', cb); num.hidden = false;
    await countTo($('span', num), G.b.n, 650);
    vsUI(ok ? 'ok' : 'no');
    cb.classList.add(ok ? 'ok' : 'no');
    if (ok) {
      G.streak++;
      const sEl = $('#g-streak'); sEl.textContent = G.streak; sEl.classList.remove('bump'); void sEl.offsetWidth; sEl.classList.add('bump');
      let record = false;
      if (G.streak > G.best) { G.best = G.streak; record = true; store.set('best:' + G.key, G.best); $('#g-best').textContent = G.best; }
      const anyKey = 'bestAny:' + G.user.name.toLowerCase();
      if (G.streak > store.get(anyKey, 0)) store.set(anyKey, G.streak);
      $('#live').textContent = t('liveOk', { b: G.b.title, bn: fmt(G.b.n), n: G.streak });
      if (record && G.streak >= 5 && G.streak % 5 === 0) confetti();
      setTimeout(() => {
        G.a = G.b;
        G.b = G.peek && G.peek !== G.a && !G.used.has(G.peek) ? G.peek : pickNext(G.a, G.streak);
        G.used.add(G.b);
        vsUI('');
        render(true);
      }, REDUCE ? 350 : 950);
    } else {
      if (!REDUCE) { cb.classList.remove('wobble'); void cb.offsetWidth; cb.classList.add('wobble'); }
      $('#live').textContent = t('liveNo', { b: G.b.title, bn: fmt(G.b.n) });
      setTimeout(gameOver, REDUCE ? 400 : 1100);
    }
  }
  function gameOver() {
    const a = G.a, b = G.b, s = G.streak;
    const isRec = s > 0 && s >= G.best;
    $('#over-n').innerHTML = s + ' <span>' + (s === 1 ? t('oneRight') : t('inARow')) + '</span>';
    $('#over-title').innerHTML = t(s >= 15 ? 't15' : s >= 8 ? 't8' : s >= 3 ? 't3' : 't0') + (isRec ? ' <span class="record">' + t('newRecord') + '</span>' : '');
    const diff = b.n === a.n ? t('same') : b.n > a.n ? t('more', { d: fmt(b.n - a.n) }) : t('less', { d: fmt(a.n - b.n) });
    $('#over-why').innerHTML = t('why', { b: esc(b.title), bn: fmt(b.n), diff, a: esc(a.title), an: fmt(a.n) }) + (isRec ? '' : t('yourBest', { n: G.best }));
    $('#over-note').textContent = '';
    $('#over').hidden = false;
    $('#over-again').focus();
  }
  function shareText() {
    let s = t('share', { n: G.streak, u: G.user.name, m: t('mode_' + state.type), p: t('period_' + state.period) });
    if (/^https?:/.test(location.protocol)) s += ' ' + location.href;
    return s;
  }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
      ta.remove(); return ok;
    }
  }
  $('#over-again').addEventListener('click', newGame);
  $('#over-home').addEventListener('click', goHome);
  $('#g-home').addEventListener('click', goHome);
  $('#over-share').addEventListener('click', async () => {
    const s = shareText();
    const ok = await copy(s);
    $('#over-note').textContent = ok ? t('copied') : s;
  });
  function goHome() {
    $('#over').hidden = true;
    show('screen-start');
    recentUI();
    if (G.user) input.value = G.user.name;
    input.focus();
  }
  document.addEventListener('keydown', e => {
    if ($('#screen-game').hidden) return;
    if (!$('#over').hidden) { if (e.key === 'Escape') goHome(); return; }
    if (e.target.closest && e.target.closest('input, select, textarea')) return;
    if (e.key === 'ArrowUp' || e.key === 'w') { e.preventDefault(); answer(true); }
    else if (e.key === 'ArrowDown' || e.key === 's') { e.preventDefault(); answer(false); }
  });

  function confetti() {
    if (REDUCE) return;
    const cv = document.createElement('canvas'); cv.className = 'confetti';
    const dpr = Math.min(2, devicePixelRatio || 1);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    document.body.appendChild(cv);
    const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
    const cols = ['#ffd84d', '#2b50d6', '#ff6f6f', '#43c97b', '#d6c6ff'];
    const ps = Array.from({ length: 110 }, () => ({ x: innerWidth / 2, y: innerHeight * 0.4, vx: (Math.random() - .5) * 13, vy: -Math.random() * 11 - 4, s: 5 + Math.random() * 5, r: Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)] }));
    const t0 = performance.now();
    (function step(now) {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      ps.forEach(p => { p.vy += 0.33; p.x += p.vx; p.y += p.vy; p.r += 0.12; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
      if (now - t0 < 1800) requestAnimationFrame(step); else cv.remove();
    })(t0);
  }

  /* ---------------- boot ---------------- */
  applyLang();
  const qp = new URLSearchParams(location.search);
  if (['artists', 'tracks', 'albums', 'mixed'].includes(qp.get('type'))) { state.type = qp.get('type'); setPick('type', state.type); }
  if (qp.get('period') && I18N.de['p_' + qp.get('period')]) { state.period = qp.get('period'); $('#period').value = state.period; }
  if (['50', '100', '200'].includes(qp.get('pool'))) { state.pool = +qp.get('pool'); setPick('pool', state.pool); }
  if (qp.get('lang') === 'en' || qp.get('lang') === 'de') { LANG = qp.get('lang'); applyLang(); }
  if (qp.get('user')) { input.value = qp.get('user'); if (apiKey()) start(); }
  else input.focus();
})();
</script>
</body>
</html>
